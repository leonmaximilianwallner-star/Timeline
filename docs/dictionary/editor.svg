event editor</text><text x="24" y="307" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">openEventEditor(event)</text><text x="372" y="292" font-size="12" fill="#8a8a96" font-weight="600" text-anchor="start">phase editor</text><text x="372" y="307" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">openPhaseEditor(phase)</text><text x="24" y="336" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">Same shell (editor): header in the thing's colour — overline, name, delete · close · done — over a raised body.</text><text x="24" y="354" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">Never "modal", "draft" or "popup".</text></svg>