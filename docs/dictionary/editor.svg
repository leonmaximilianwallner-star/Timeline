<svg xmlns="http://www.w3.org/2000/svg" width="720" height="374" viewBox="0 0 720 374" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Editors: the event editor and the phase editor share one shell"><title>Editors: the event editor and the phase editor share one shell</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a96"/></marker></defs><rect x="0" y="0" width="720" height="374" rx="14" fill="#111118"/><text x="24" y="32" font-size="10" fill="#8a8a96" font-weight="600" text-anchor="start" letter-spacing="1">EDITORS — ONE SHELL, NAMED AFTER THE THING</text><rect x="24" y="52" width="300" height="70" rx="24" fill="#f4971f"/><text x="44" y="78" font-size="10" fill="#ededec" font-weight="600" text-anchor="start" letter-spacing="1">ARBEIT</text><text x="44" y="102" font-size="18" fill="#ededec" font-weight="600" text-anchor="start">Tutorium</text><circle cx="228" cy="86" r="13" fill="#23232c80"/><circle cx="262" cy="86" r="13" fill="#23232c80"/><circle cx="296" cy="86" r="13" fill="#23232c80"/><path d="M223 82 h10 M225 82 v9 h6 v-9" stroke="#ededec" stroke-width="1.4" fill="none"/><path d="M258 82 l8 8 M266 82 l-8 8" stroke="#ededec" stroke-width="1.6" stroke-linecap="round"/><path d="M291 86 l3.5 3.5 6-7" stroke="#ededec" stroke-width="1.8" fill="none" stroke-linecap="round"/><rect x="24" y="108" width="300" height="162" rx="24" fill="#23232c"/><text x="44" y="138" font-size="14" fill="#ededec" font-weight="400" text-anchor="start">Di 20. Okt</text><text x="304" y="138" font-size="14" fill="#8a8a96" font-weight="400" text-anchor="end">09:00 – 11:00</text><line x1="44" y1="156" x2="304" y2="156" stroke="#2e2e38" stroke-width="1"/><text x="44" y="182" font-size="14" fill="#ededec" font-weight="400" text-anchor="start">Wiederholung</text><text x="304" y="182" font-size="14" fill="#8a8a96" font-weight="400" text