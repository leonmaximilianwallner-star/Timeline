<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Phase: a pill on the timeline view; closed or open on the canvas view"><title>Phase: a pill on the timeline view; closed or open on the canvas view</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a96"/></marker></defs><rect x="0" y="0" width="720" height="448" rx="14" fill="#111118"/><text x="24" y="32" font-size="10" fill="#8a8a96" font-weight="600" text-anchor="start" letter-spacing="1">PHASE — ONE THING, THREE LOOKS</text><text x="24" y="64" font-size="12" fill="#8a8a96" font-weight="600" text-anchor="start">timeline view</text><rect x="24" y="76" width="320" height="28" rx="14.0" fill="#1b2a31"/><rect x="24" y="76" width="150" height="28" rx="14.0" fill="#40838b"/><circle cx="40" cy="90" r="7" fill="#23232c"/><path d="M38 87 l4 3 -4 3" stroke="#ededec" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="54" y="95" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">Schreiben</text><text x="360" y="88" font-size="12" fill="#8a8a96" font-weight="600" text-anchor="start">phase pill · fill = progress</text><text x="360" y="103" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">the arrow opens the phase dropdown</text><text x="24" y="140" font-size="12" fill="#8a8a96" font-weight="600" text-anchor="start">canvas view, closed</text><rect x="24" y="152" width="220" height="32" rx="16.0" fill="#40838b"/><path d="M38 164 l4 4 4 -4" stroke="#ededec" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="56" y="173" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">Schreiben</text><text x="230" y="173" font-size="12" fill="#ededec" font-weight="400" text-anchor="end">2/5</text><text x="360" y="166" font-size="12" fill="#8a8a96" font-weight="600" text-anchor="start">count = steps done / total</text><text x="360" y="181" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">open: false</text><text x="24" y="220" font-size="12" fill="#8a8a96" font-weight="600" text-anchor="start">canvas view, open</text><rect x="24" y="232" width="480" height="196" rx="24" fill="#40838b"/><text x="44" y="256" font-size="10" fill="#ededec" font-weight="600" text-anchor="start" letter-spacing="1">PHASE · 28.9. – 1.11.</text><text x="44" y="280" font-size="18" fill="#ededec" font-weight="600" text-anchor="start">Schreiben</text><text x="444" y="280" font-size="12" fill="#ededec" font-weight="400" text-anchor="end">2/5</text><circle cx="472" cy="272" r="14" fill="#40838b" stroke="#ededec" stroke-width="1"/><path d="M467 275 l5 -5 5 5" stroke="#ededec" stroke-width="1.8" fill="none" stroke-linecap="round"/><rect x="316" y="300" width="174" height="120" rx="14" fill="#23232c" stroke="#40838b" stroke-width="2"/><text x="362" y="324" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">Schluss</text><circle cx="370" cy="348" r="7" fill="none" stroke="#ededec" stroke-width="1.5"/><text x="384" y="352" font-size="12" fill="#ededec" font-weight="400" text-anchor="start">Schritt</text><rect x="174" y="300" width="174" height="120" rx="14" fill="#23232c" stroke="#40838b" stroke-width="2"/><text x="220" y="324" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">Hauptteil</text><circle cx="228" cy="348" r="7" fill="none" stroke="#ededec" stroke-width="1.5"/><text x="242" y="352" font-size="12" fill="#ededec" font-weight="400" text-anchor="start">Schritt</text><rect x="32" y="300" width="174" height="120" rx="14" fill="#23232c" stroke="#40838b" stroke-width="2"/><text x="46" y="324" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">Einleitung</text><circle cx="54" cy="348" r="7" fill="#40838b"/><path d="M50.5 348 l2.5 2.5 l4.5 -5" stroke="#111118" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="352" font-size="12" fill="#ededec" font-weight="400" text-anchor="start">Schritt</text><text x="520" y="280" font-size="12" fill="#8a8a96" font-weight="600" text-anchor="start">open phase</text><text x="520" y="295" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">a squircle, radius 24</text><text x="520" y="342" font-size="12" fill="#8a8a96" font-weight="600" text-anchor="start">its blocks inside</text><text x="520" y="357" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">each covers the next</text><text x="520" y="372" font-size="12" fill="#8a8a96" font-weight="600" text-anchor="start"></text><text x="520" y="387" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">one cell; leftmost on top</text></svg>