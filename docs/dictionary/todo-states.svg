<svg xmlns="http://www.w3.org/2000/svg" width="720" height="192" viewBox="0 0 720 192" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Todo states: open, done, cancelled, postponed"><title>Todo states: open, done, cancelled, postponed</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a96"/></marker></defs><rect x="0" y="0" width="720" height="192" rx="14" fill="#111118"/><text x="24" y="32" font-size="10" fill="#8a8a96" font-weight="600" text-anchor="start" letter-spacing="1">TODO STATES</text><rect x="24" y="52" width="160" height="92" rx="8" fill="#1a1a22"/><circle cx="48" cy="78" r="7" fill="none" stroke="#ededec" stroke-width="1.5"/><text x="66" y="82" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">offen</text><text x="40" y="108" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">open</text><text x="40" y="126" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">click → done</text><rect x="198" y="52" width="160" height="92" rx="8" fill="#1a1a22"/><circle cx="222" cy="78" r="7" fill="#ededec"/><path d="M218.5 78 l2.5 2.5 l4.5 -5" stroke="#111118" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="82" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">erledigt</text><text x="214" y="108" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">done</text><text x="214" y="126" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">click → cancelled</text><rect x="372" y="52" width="160" height="92" rx="8" fill="#1a1a22"/><circle cx="396" cy="78" r="7" fill="none" stroke="#ededec" stroke-width="1.5"/><path d="M393 75 l6 6 M399 75 l-6 6" stroke="#ededec" stroke-width="1.6" stroke-linecap="round"/><text x="414" y="82" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">abgesagt</text><text x="388" y="108" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">cancelled</text><text x="388" y="126" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">click → open</text><rect x="546" y="52" width="160" height="92" rx="8" fill="#1a1a22"/><circle cx="570" cy="78" r="7" fill="none" stroke="#ededec" stroke-width="1.5"/><path d="M566.5 78 h6 m-2.5 -2.5 l2.5 2.5 l-2.5 2.5" stroke="#ededec" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="588" y="82" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">verschoben</text><text x="562" y="108" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">postponed</text><text x="562" y="126" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">right-click</text><text x="24" y="172" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">Changing a state is ticking: tickTodo.  Postponed todos come along to the next event (carry-over).</text></svg>