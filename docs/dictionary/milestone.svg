<svg xmlns="http://www.w3.org/2000/svg" width="720" height="224" viewBox="0 0 720 224" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Milestone: a dot on a project spine, or a chip"><title>Milestone: a dot on a project spine, or a chip</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a96"/></marker></defs><rect x="0" y="0" width="720" height="224" rx="14" fill="#111118"/><text x="24" y="32" font-size="10" fill="#8a8a96" font-weight="600" text-anchor="start" letter-spacing="1">MILESTONE — A POINT IN TIME</text><line x1="24" y1="80" x2="520" y2="80" stroke="#40838b" stroke-width="2"/><text x="24" y="66" font-size="12" fill="#40838b" font-weight="600" text-anchor="start">Seminararbeit  (project spine)</text><circle cx="200" cy="80" r="5" fill="#40838b"/><text x="200" y="100" font-size="12" fill="#ededec" font-weight="400" text-anchor="middle">Review</text><path d="M500 72 l2.4 5 5.4 .6 -4 3.7 1.1 5.3 -4.9-2.8 -4.9 2.8 1.1-5.3 -4-3.7 5.4-.6z" fill="#8fc14e"/><text x="500" y="100" font-size="12" fill="#ededec" font-weight="400" text-anchor="middle">Abgabe</text><text x="560" y="76" font-size="12" fill="#8a8a96" font-weight="600" text-anchor="start">on its project's spine</text><text x="560" y="91" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">dot · final = ★</text><line x1="24" y1="132" x2="696" y2="132" stroke="#2e2e38" stroke-width="1"/><rect x="24" y="152" width="190" height="32" rx="16.0" fill="#e9473a"/><text x="40" y="166" font-size="12" fill="#ededec" font-weight="600" text-anchor="start">Präsentation</text><text x="40" y="179" font-size="10" fill="#ededec" font-weight="400" text-anchor="start">30 Punkte</text><line x1="119" y1="184" x2="119" y2="204" stroke="#e9473a" stroke-width="1.5"/><text x="240" y="166" font-size="12" fill="#8a8a96" font-weight="600" text-anchor="start">milestone chip</text><text x="240" y="181" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">no project → a chip</text><text x="440" y="166" font-size="12" fill="#8a8a96" font-weight="600" text-anchor="start">not an exam</text><text x="440" y="181" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">exam is a topic, not a kind</text></svg>