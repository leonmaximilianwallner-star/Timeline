<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Shapes: pill, squircle, circle, dot"><title>Shapes: pill, squircle, circle, dot</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a96"/></marker></defs><rect x="0" y="0" width="720" height="250" rx="14" fill="#111118"/><text x="24" y="32" font-size="10" fill="#8a8a96" font-weight="600" text-anchor="start" letter-spacing="1">SHAPES — LOOK WORDS, NEVER NAMES OF THINGS</text><rect x="24" y="70" width="150" height="32" rx="16.0" fill="#40838b"/><text x="40" y="91" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">Schreiben</text><rect x="214" y="54" width="150" height="64" rx="8" fill="#f4971f"/><text x="226" y="78" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">Einleitung</text><circle cx="428" cy="86" r="18" fill="#23232c" stroke="#2e2e38" stroke-width="1.5"/><path d="M428 77 v18 M419 86 h18" stroke="#ededec" stroke-width="2" stroke-linecap="round"/><circle cx="596" cy="86" r="5" fill="#e9473a"/><text x="24" y="150" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">pill</text><text x="24" y="168" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">ends are half circles</text><text x="24" y="184" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">radius = height / 2</text><text x="214" y="150" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">squircle</text><text x="214" y="168" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">rounded corners</text><text x="214" y="184" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">radius 8 · 14 · 24</text><text x="404" y="150" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">circle</text><text x="404" y="168" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">buttons, marks</text><text x="404" y="184" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">always perfectly round</text><text x="584" y="150" font-size="14" fill="#ededec" font-weight="600" text-anchor="start">dot</text><text x="584" y="168" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">a point in time,</text><text x="584" y="184" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">a zoomed-out thing</text><line x1="24" y1="206" x2="696" y2="206" stroke="#2e2e38" stroke-width="1"/><text x="24" y="230" font-size="12" fill="#8a8a96" font-weight="400" text-anchor="start">"The teal pill" describes a look.  "The phase" names the thing.</text></svg>